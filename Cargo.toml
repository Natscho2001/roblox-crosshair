[package]
name = "roblox-crosshair"
version = "0.2.0"
edition = "2021"
description = "Click-through crosshair overlay for Wayland (wlr-layer-shell), e.g. for Roblox via Sober on KDE Plasma"
license = "MIT"
repository = "https://github.com/Natscho2001/roblox-crosshair"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["fs", "event", "shm", "mm"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
